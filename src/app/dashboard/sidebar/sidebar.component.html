<div class="sidebar" [class.open]="isOpen">

  <!-- Header -->
  <div class="sidebar-header">
    <span>Menu</span>
    <button (click)="close.emit()">✖</button>
  </div>

  <!-- Menu -->
<li [class.active]="activeItem === 'user'" (click)="goToUser()">👤 User</li>
<li [class.active]="activeItem === 'images'" (click)="goToImages()">🖼️ Images</li>
<li [class.active]="activeItem === 'graphs'" (click)="goToGraphs()">📊 Graphs</li>

</div>
